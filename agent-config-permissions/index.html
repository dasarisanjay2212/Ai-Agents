<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Config & Permissions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="back" href="../index.html">Back to hub</a>
    <h1>Agent configuration & permissions</h1>
    <p>Choose an agent, tune how it runs, and decide what it is allowed to do.</p>
  </header>

  <main class="layout">
    <nav class="agents" aria-label="Agents">
      <ul id="agentList"></ul>
    </nav>

    <section class="panel" id="panel" aria-live="polite">
      <div class="panel-head">
        <div>
          <h2 id="agentName"></h2>
          <p id="agentRole"></p>
        </div>
        <label class="master">
          <span>Agent enabled</span>
          <input type="checkbox" id="enabled" class="switch">
        </label>
      </div>

      <fieldset class="settings">
        <legend>Run settings</legend>
        <label>Model
          <select id="model">
            <option>Fast</option>
            <option>Balanced</option>
            <option>Thorough</option>
          </select>
        </label>
        <label>Creativity <output id="tempOut"></output>
          <input type="range" id="temperature" min="0" max="1" step="0.1">
        </label>
        <label>Max steps per task
          <input type="number" id="maxSteps" min="1" max="100">
        </label>
      </fieldset>

      <div class="perm-head">
        <h3>Permissions</h3>
        <div class="presets" role="group" aria-label="Permission presets">
          <button type="button" data-preset="readonly">Read-only</button>
          <button type="button" data-preset="standard">Standard</button>
          <button type="button" data-preset="full">Full access</button>
        </div>
      </div>
      <div id="permGroups"></div>
    </section>
  </main>

  <div class="savebar" id="savebar" hidden>
    <span id="saveMsg">You have unsaved changes.</span>
    <button type="button" id="resetBtn" class="ghost">Discard</button>
    <button type="button" id="saveBtn">Save changes</button>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
